# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  test:
    cmds:
      - uv run pytest -vv

  format:
    cmds:
      - uv run ruff format

  lint:
    cmds:
      - uv run ruff check

  lint-fix:
    cmds:
      - uv run ruff check --fix

  dev:
    cmds:
      - uv run main.py
